<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura — glass rail (standalone reference)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Arimo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0a0f22; --ink-2:#39415f; --accent:#d81f12;
  --font-display:"Arimo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font-body);color:var(--ink);background:#eef2fb;-webkit-font-smoothing:antialiased}
/* the ground the glass needs: soft colour behind it, or the blur has nothing to refract */
.ground{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.ground i{position:absolute;border-radius:50%;filter:blur(70px);display:block}
.ground i:nth-child(1){width:900px;height:620px;left:-12%;top:-24%;background:radial-gradient(circle,rgba(120,150,255,.62),transparent 68%)}
.ground i:nth-child(2){width:760px;height:560px;right:-10%;top:-18%;background:radial-gradient(circle,rgba(255,150,190,.55),transparent 68%)}
.ground i:nth-child(3){width:980px;height:640px;left:34%;bottom:-30%;background:radial-gradient(circle,rgba(120,225,225,.5),transparent 68%)}
.layout{position:relative;display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.demo{padding:40px 34px;font-size:13px;color:var(--ink-2);max-width:46ch;line-height:1.6}
@media (max-width:1080px){.layout{grid-template-columns:212px minmax(0,1fr)}}
@media (max-width:820px){.layout{grid-template-columns:minmax(0,1fr)}.rail{display:none}}

/* ── sidebar ───────────────────────────────────────── */
/* numbered index + one elastic glass indicator that travels between rows,
   labels roll over on hover (award-circuit sidebar vocabulary, on our glass) */
.rail{
  position:sticky;top:71px;align-self:start;max-height:calc(100vh - 85px);
  display:flex;flex-direction:column;
  margin:14px 0 14px 14px;padding:16px 8px;border-radius:22px;
  background:linear-gradient(168deg,rgba(255,255,255,.44),rgba(255,255,255,.18));
  border:1px solid rgba(255,255,255,.58);
  backdrop-filter:blur(40px) saturate(190%);-webkit-backdrop-filter:blur(40px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 26px 50px -26px rgba(22,32,68,.5);
  transition:opacity .2s,transform .26s cubic-bezier(.2,.8,.3,1);
}
.kbd{font-size:10.5px;color:var(--ink-2);font-weight:600;border:1px solid rgba(10,15,34,.22);border-radius:6px;padding:1px 5px}
.rail-inner{position:relative;flex:1;min-height:0;overflow:auto;padding:0 2px}
.rail-inner::-webkit-scrollbar{width:6px}
.rail-inner::-webkit-scrollbar-thumb{background:rgba(22,32,68,.16);border-radius:3px}
/* the travelling indicator */
.rail-lens{
  position:absolute;left:2px;right:2px;border-radius:13px;pointer-events:none;
  height:var(--lens-h,0px);opacity:var(--lens-o,0);transform:translateY(var(--lens-y,0px));
  background:linear-gradient(168deg,rgba(255,255,255,.95),rgba(255,255,255,.6));
  box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(255,255,255,.85),0 14px 26px -16px rgba(22,32,68,.6);
  transition:none;will-change:transform;
}
/* animate only after the first placement has painted */
.rail-lens.is-ready{transition:transform .42s cubic-bezier(.22,1.3,.32,1),height .28s cubic-bezier(.22,1.3,.32,1),opacity .2s}
.rail-label{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--ink-2);opacity:.72;padding:0 12px 9px}
.rail-label.spaced{padding-top:20px}
.rail-group{display:flex;flex-direction:column}
.nav{
  position:relative;z-index:1;display:flex;align-items:center;gap:11px;width:100%;
  padding:9px 12px;border:0;border-radius:13px;background:none;text-align:left;cursor:pointer;
  color:var(--ink-2);transition:color .18s;isolation:isolate;
}
.nav .no{
  flex:none;width:16px;font:700 9.5px var(--font-display);letter-spacing:.04em;
  color:var(--ink-2);opacity:.55;transition:color .18s,opacity .18s;
}
/* label: shifts a hair and an accent underline draws in from the left */
.nav .roll{position:relative;display:block;flex:1;min-width:0}
.nav .roll span{
  display:block;font:600 13.5px var(--font-body);line-height:18px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:transform .32s cubic-bezier(.22,1,.32,1);
}
.nav:hover .roll span{transform:translateX(4px)}
/* a light red wash flows across the row while hovered */
.nav::before{
  content:"";position:absolute;inset:0;border-radius:13px;pointer-events:none;z-index:-1;
  overflow:hidden;opacity:0;transition:opacity .22s;
  background:linear-gradient(100deg,
    rgba(216,31,18,0) 0%,
    rgba(216,31,18,.07) 22%,
    rgba(216,31,18,.17) 50%,
    rgba(216,31,18,.07) 78%,
    rgba(216,31,18,0) 100%);
  background-size:220% 100%;background-position:-60% 0;
}
.nav:hover::before{opacity:1;animation:railFlow 1.9s linear infinite}
.nav.active::before{opacity:1;background-position:50% 0}
@keyframes railFlow{from{background-position:-60% 0}to{background-position:160% 0}}
@media (prefers-reduced-motion:reduce){.nav:hover::before{animation:none;background-position:50% 0}}
.nav:hover,.nav.active{color:var(--ink)}
.nav.active .no{color:var(--accent);opacity:1}
.nav:active{transform:scale(.994)}
.nav .count{font-size:11px;font-weight:600;color:var(--ink-2);opacity:.75;white-space:nowrap}
.nav.active .count{color:var(--accent);opacity:1;font-weight:700}
</style>
</head>
<body>
<div class="ground"><i></i><i></i><i></i></div>
<div class="layout">
<aside class="rail">
  <div class="rail-inner" id="railInner">
    <div class="rail-lens" id="railIndicator"></div>
    <div class="rail-label">PINNED</div>
    <div class="rail-group">
    <button class="nav active"><span class="no">01</span><span class="roll"><span>WMS</span></span><span class="count">4</span></button>
    <button class="nav"><span class="no">02</span><span class="roll"><span>Goals</span></span><span class="count">72%</span></button>
    </div>
    <div class="rail-label spaced">ALL WORKSPACES</div>
    <nav id="railList" class="rail-group"></nav>
  </div>
</aside>
  <main class="demo">
    <p>The rail is the component. Hover a row: a light red wash flows across it and the glass
    indicator travels to it with an elastic overshoot. Click to move the selection.</p>
  </main>
</div>
<script>
const WORKSPACES = ["Team Productivity","Billing","HR","Sales","Accounts","Training","Employees","Monthly Events","HandHolding","Project"];
document.getElementById("railList").innerHTML = WORKSPACES
  .map((name, i) => `<button class="nav"><span class="no">${String(i + 3).padStart(2, "0")}</span>` +
    `<span class="roll"><span>${name}</span></span></button>`).join("");

/* one elastic indicator: follows the pointer, rests on the selected row */
(() => {
  const inner = document.getElementById("railInner");
  const lens = document.getElementById("railIndicator");
  const place = el => {
    if (!el) { lens.style.setProperty("--lens-o", "0"); return; }
    lens.style.setProperty("--lens-o", "1");
    lens.style.setProperty("--lens-h", el.offsetHeight + "px");
    lens.style.setProperty("--lens-y", el.offsetTop + "px");
    if (!lens.classList.contains("is-ready")) setTimeout(() => lens.classList.add("is-ready"), 60);
  };
  const rest = () => {
    const el = inner.querySelector(".nav.active");
    if (el && el.offsetHeight) place(el);
  };
  /* timer retry — rAF is paused in background frames, so don't depend on it */
  let tries = 0;
  const tick = () => {
    const el = inner.querySelector(".nav.active");
    if (el && el.offsetHeight) return place(el);
    if (++tries < 40) setTimeout(tick, 50);
  };
  tick();
  window.placeRailLens = rest;
  window.addEventListener("load", tick);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(rest);
  if (window.ResizeObserver) new ResizeObserver(entries => {
    if (!entries.some(e => e.contentRect.height > 0)) return;
    const el = inner.querySelector(".nav.active");
    if (el) place(el);
  }).observe(inner);
  inner.addEventListener("mouseover", e => {
    const n = e.target.closest(".nav");
    if (n) place(n);
  });
  inner.addEventListener("mouseleave", rest);
  inner.addEventListener("scroll", () => place(inner.querySelector(".nav:hover") || inner.querySelector(".nav.active")), {passive:true});
  inner.addEventListener("click", e => {
    const n = e.target.closest(".nav");
    if (!n) return;
    inner.querySelectorAll(".nav.active").forEach(x => x.classList.remove("active"));
    n.classList.add("active");
  });
  window.addEventListener("resize", rest);
})();
</script>
</body>
</html>
